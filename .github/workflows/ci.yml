name: Build & Validação Astro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Instalar dependências
        run: npm ci
      - name: Testes automatizados
        run: npm test
      - name: Build estático de produção
        run: npm run build
